name: Research artifact checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  analysis:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q src scripts
      - name: Run offline example
        run: python src/pipeline/03_evaluate_defenses.py --data-dir data/example --output results/local/ci --protocol held-out
      - uses: actions/upload-artifact@v4
        with:
          name: example-analysis-${{ matrix.os }}
          path: results/local/ci
